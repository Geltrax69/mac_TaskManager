name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -scheme MacCleaner \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/build.log

      - name: Surface build errors
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "error:" /tmp/build.log | sort -u | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Test
        run: >
          xcodebuild
          -scheme MacCleaner
          -destination 'platform=macOS'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGN_IDENTITY=""
          test
